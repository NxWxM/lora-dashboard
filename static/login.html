<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Admin Panel</title>
  
  <style>
    /* Theme Variables from Dashboard */
    :root {
      --bg: #0b1020; 
      --card: #0f1724; 
      --muted: #92a0b3; 
      --accent: #4f9ef6; 
      --glass: rgba(255,255,255,0.04);
      --radius: 12px; 
      --gap: 18px; 
      
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      font-size: 16px;
    }
    
    * { box-sizing: border-box; }
    
    /* Global Background */
    body {
      margin: 0;
      background: linear-gradient(180deg, #061021 0%, #081426 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex; /* Enable flexbox for centering */
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
    }

    /* Login Card Container */
    #loginForm {
      width: 100%;
      max-width: 360px;
      padding: 30px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Headings */
    #loginForm h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #e6eef8;
      text-align: center;
      font-weight: 600;
    }

    /* Labels and Inputs */
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      color: var(--muted);
      gap: 6px;
    }

    input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #e6eef8;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      outline: none;
    }
    
    /* Submit Button (Matching .btn style) */
    button[type="submit"] {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent); /* Use accent color for primary action */
      color: var(--bg); /* Dark text on bright button */
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s, opacity 0.2s;
    }
    button[type="submit"]:hover {
      background: #3f8ce0; /* Slightly darker on hover */
    }
    button[type="submit"]:active {
      opacity: 0.8;
    }

    /* Message Box */
    #msg {
      font-size: 0.9rem;
      border: 1px solid; /* Border will use the color set by JavaScript (red/green) */
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

<form id="loginForm" action="/login" method="post">
  <h2>Admin Login</h2>
  <label>
    Username
    <input name="username" id="user" required />
  </label>
  <label>
    Password
    <input name="password" id="pass" type="password" required />
  </label>

  <p id="msg" style="display:none; padding:10px; border-radius:8px;"></p>

  <button type="submit">Login</button>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const form = e.target;
  const fd = new FormData(form); // collects name/value pairs (must match your Form(...) parameter names)

  // send formdata (do NOT set Content-Type header; browser sets boundary automatically)
  const response = await fetch("/login", {
    method: "POST",
    body: fd,
    credentials: "same-origin" // ensures cookies from same origin are included/accepted
  });

  const msgBox = document.getElementById("msg");
  msgBox.style.display = "block";
  
  // Clear any existing border styling before applying new color
  msgBox.style.borderColor = "";

  // Helpful debug (open DevTools → Console)
  console.log("status:", response.status);
  console.log("redirected:", response.redirected);
  console.log("response url:", response.url);
  const ct = (response.headers.get("content-type") || "").toLowerCase();
  console.log("content-type:", ct);

  // If your backend returns JSON on success (recommended)
  if (ct.includes("application/json")) {
    const data = await response.json();
    console.log("json:", data);

    // success -> frontend performs navigation (backend already set cookie on the JSONResponse)
    if (data && data.success && data.redirect) {
      msgBox.style.color = "#28a745"; // Success green
      msgBox.style.borderColor = "#28a745";
      msgBox.innerText = "Login successful — redirecting...";
      // navigate to dashboard
      window.location.href = data.redirect;
      return;
    }

    // else show an error message
    msgBox.style.color = "#dc3545"; // Error red
    msgBox.style.borderColor = "#dc3545";
    msgBox.innerText = data.message ?? JSON.stringify(data);
    return;
  }

  // If server returned plain text or other
  const text = await response.text();
  console.log("text:", text);
  
  // Apply error style default
  msgBox.style.color = "#dc3545"; // Error red
  msgBox.style.borderColor = "#dc3545";


  // If text contains html (happens if a redirect was followed and fetch returned the dashboard HTML),
  if (text.trim().toLowerCase().startsWith("<!doctype") || text.toLowerCase().includes("<html")) {
    console.warn("Server returned full HTML; navigating to response URL instead of showing it.");
    window.location.href = response.url;
    return;
  }

  // Otherwise show plain text error
  msgBox.innerText = text || "Unexpected server response";
});
</script>

</body>
</html>
